name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          for (const manifest of ["package.json", "client/package.json", "proxy/package.json"]) {
              const actual = JSON.parse(fs.readFileSync(manifest, "utf8")).version;
              if (actual !== expected) {
                  throw new Error(`${manifest} has ${actual}; expected ${expected}`);
              }
          }
          NODE
      - run: npm run build
      - run: npm run build --workspaces
      - run: npm publish --provenance
      - run: npm publish --workspace client --provenance
      - run: npm publish --workspace proxy --provenance
